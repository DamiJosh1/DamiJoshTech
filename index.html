    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SAJODA ELECTRONICS",
      "url": "https://sajodaelectronics.com",
      "logo": "https://sajodaelectronics.com/favicon.svg"
    }
    </script>
    <script>
      (function() {
        var isExtensionError = function(msg, stack, filename) {
          var combined = (msg || '') + ' ' + (stack || '') + ' ' + (filename || '');
          return (
            combined.indexOf('chrome-extension://') !== -1 ||
            combined.indexOf('moz-extension://') !== -1 ||
            combined.indexOf('safari-extension://') !== -1 ||
            combined.indexOf('Failed to connect to MetaMask') !== -1 ||
            combined.indexOf('inpage.js') !== -1
          );
        };
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && reason.message) ? reason.message : String(reason || '');
          var stack = (reason && reason.stack) ? reason.stack : '';
          if (isExtensionError(msg, stack, '')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          var msg = (event && event.message) || (event && event.error && event.error.message) || '';
          var stack = (event && event.error && event.error.stack) || '';
          var filename = (event && event.filename) || '';
          if (isExtensionError(msg, stack, filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        try {
          var config = JSON.parse(localStorage.getItem('sajoda_monetization_config') || '{}');
          if (config && config.enabled && config.googleAdSenseId) {
            var s = document.createElement('script');
            s.async = true;
            s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + encodeURIComponent(config.googleAdSenseId);
            s.crossOrigin = 'anonymous';
            document.head.appendChild(s);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans text-body-text bg-light-bg">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #ffffff; color: #18181b;">
        <div style="width: 26px; height: 26px; border: 2px solid #e4e4e7; border-top-color: #18181b; border-radius: 50%; animation: sajoda-spin 0.75s cubic-bezier(0.4, 0, 0.2, 1) infinite; margin-bottom: 14px;"></div>
        <div style="font-size: 10px; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; color: #71717a;">SAJODA</div>
      </div>
      <style>
        @keyframes sajoda-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
